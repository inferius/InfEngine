[workspace]
resolver = "2"
members = [
    "crates/infengine_core",
    "crates/infengine_window",
    "crates/infengine_render",
    "crates/infengine_assets",
    "crates/infengine_audio",
    "crates/infengine_editor",
    "crates/infengine_physics",
    "crates/infengine_scripting",
    "crates/infengine_editor_app",
    "crates/infengine_runtime",
    "crates/infengine_blueprint",
    "crates/infengine_voxel",
    "crates/infengine_net",
    "crates/infengine_particles",
    "crates/infengine_master_server",
    "examples/sprite_demo",
    "examples/cube_demo",
    "examples/csharp_demo",
    "examples/demo_game",
    "examples/voxel_demo",
    "examples/voxel_demo_mp",
    "examples/showcase",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/michalosoft/InfEngine"
authors = ["Michal <michalosoft@gmail.com>"]
rust-version = "1.95"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
# Math
glam = { version = "0.30", features = ["serde"] }

# Logging / errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.10"
bincode = "2"
zstd = "0.13"

# Filesystem
directories = "6"
tempfile = "3"

# Time
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# Async / utils
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"

# Renderer / window (added when crates start using them)
wgpu = "27"
winit = "0.30"
pollster = "0.4"

# ECS
bevy_ecs = "0.17"

# Assets
notify = "8"
image = "0.25"
kira = "0.10"
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = "0.33"
rapier2d = "0.28"
rapier3d = "0.28"
gltf = "1"
netcorehost = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
