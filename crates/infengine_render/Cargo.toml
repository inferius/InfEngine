[package]
name = "infengine_render"
description = "GPU rendering layer for InfEngine, built on wgpu."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
infengine_core = { path = "../infengine_core" }
infengine_window = { path = "../infengine_window" }
infengine_particles = { path = "../infengine_particles" }
tracing = { workspace = true }
thiserror = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
winit = { workspace = true }
gltf = { workspace = true }
image = { workspace = true }

[dev-dependencies]
# W199: validate bundled .wgsl shaders at `cargo test` time (same naga
# version wgpu 27 uses) so a shader error fails the test suite instead of
# crashing the app at create_shader_module() on launch.
naga = { version = "27", features = ["wgsl-in"] }
