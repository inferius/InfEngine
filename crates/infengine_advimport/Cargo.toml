[package]
name = "infengine_advimport"
description = "Offline importer that converts adventure-game data files into InfEngine's room format. Not a runtime dependency of the engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
moont = { version = "1.0.0", optional = true }
vorbis_rs = { version = "0.5.6", optional = true }
infengine_adventure = { path = "../infengine_adventure" }
glam = { workspace = true }
image = { workspace = true }
ron = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

[[bin]]
name = "adv-import"
path = "src/bin/adv_import.rs"

[features]
default = []
# Roland MT-32 rendering. Off by default: the emulator is LGPL and the
# rest of this workspace is MIT OR Apache-2.0, so linking it is a
# decision rather than a side effect. It is only ever used offline.
mt32 = ["dep:moont", "dep:vorbis_rs"]
